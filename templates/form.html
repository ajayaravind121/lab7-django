<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI</title>
</head>
<body>
<form method="post">
        {% csrf_token %}
        <table>
            <tr><td>Weight (lbs):</td><td><input type="text" name="weight"></td></tr>
            <tr><td>Height (ft):</td><td><input type="text" name="ft"></td></tr>
            <tr><td>Height (in):</td><td><input type="text" name="in"></td></tr>
            <tr><td></td><td><input type="submit" value="Submit"></td></tr>
        </table>
    </form>

    <p>{{ bmi }}</p>

    {% for m in message %}
        <p>{{ m }}</p>
    {% endfor %}
</body>
</html>
